<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京鐵道車站你記得幾個？</title>
<style>
  :root{
    --gold:#b8860b;
    --gold-dark:#96690a;
    --ink:#2b2b2b;
    --muted:#8a8a8a;
    --line:#e4e2dd;
    --panel-bg:#ffffff;
    --bg:#fafaf8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:14px 22px 8px 22px; border-bottom:1px solid var(--line); flex-shrink:0;
    background:var(--panel-bg);
  }
  header h1{font-size:22px; margin:0; font-weight:700;}
  header .sub{font-size:12.5px; color:var(--muted); margin-top:4px;}
  header .stats{font-size:16px; white-space:nowrap;}
  header .stats b{font-size:22px; color:var(--gold-dark);}
  main{flex:1; display:flex; min-height:0;}
  #mapwrap{
    flex:1; position:relative; overflow:hidden; background:
      linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(rgba(0,0,0,.03) 1px, transparent 1px) 0 0/28px 28px, #fdfdfc;
    cursor:grab;
  }
  #mapwrap.dragging{cursor:grabbing;}
  svg{width:100%; height:100%; display:block; user-select:none;}
  .line-path{fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:9;}
  .station-dot{stroke-width:3.2; cursor:pointer; transition:r .15s, fill .2s;}
  .station-dot.unfound{fill:#ffffff; stroke:#a9a9a9;}
  .station-dot.found{stroke:#3a3a3a;}
  .station-dot.revealed-miss{fill:#fff; stroke:#d9534f; stroke-dasharray:2 2;}
  .station-label{
    font-size:15px; font-weight:600; fill:#2b2b2b; opacity:0; pointer-events:none;
    paint-order:stroke; stroke:#fff; stroke-width:3.5; transition:opacity .25s;
  }
  .station-label.show{opacity:1;}
  .station-label.miss{fill:#c0392b;}
  .zoom-ctrl{
    position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column;
    gap:6px; z-index:5;
  }
  .zoom-ctrl button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:17px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.08);
    color:#555;
  }
  .zoom-ctrl button:hover{background:#f2f2f0;}
  #sidebar{
    width:380px; flex-shrink:0; border-left:1px solid var(--line); background:var(--panel-bg);
    display:flex; flex-direction:column; padding:18px 18px 14px 18px; overflow-y:auto;
  }
  #inputRow{display:flex; gap:8px;}
  #stationInput{
    flex:1; padding:11px 12px; border:1px solid #cfcac0; border-radius:8px;
    font-size:15px; outline:none;
  }
  #stationInput:focus{border-color:var(--gold);}
  #confirmBtn{
    padding:0 18px; border:1px solid var(--gold); background:#fff; color:var(--gold-dark);
    border-radius:8px; font-size:15px; cursor:pointer; font-weight:600;
  }
  #confirmBtn:hover{background:#fbf2e0;}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.7; margin:12px 0 14px 0;}
  .action-row{display:flex; gap:10px; margin-bottom:16px;}
  .action-row button{
    flex:1; padding:11px 0; border-radius:8px; font-size:14.5px; cursor:pointer; font-weight:600; border:1px solid var(--line);
  }
  #revealBtn{background:#fff; color:#555;}
  #revealBtn:hover{background:#f2f2f0;}
  #submitBtn{background:var(--gold); color:#fff; border-color:var(--gold);}
  #submitBtn:hover{background:var(--gold-dark);}
  #lineListHead{
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid var(--line); padding-top:10px; margin-top:2px;
    font-size:12.5px; color:var(--muted);
  }
  .line-bulk-btns{display:flex; gap:6px;}
  .line-bulk-btns button{
    font-size:12px; padding:3px 9px; border-radius:12px; border:1px solid var(--line);
    background:#fff; color:#666; cursor:pointer;
  }
  .line-bulk-btns button:hover{background:#f2f2f0;}
  #lineList{padding-top:4px;}
  .line-row{
    display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:14px; cursor:pointer;
    border-radius:6px;
  }
  .line-row:hover{background:#f5f4f1;}
  .line-row.line-off{opacity:.4;}
  .line-row .lvis{flex-shrink:0; width:15px; height:15px; cursor:pointer; accent-color:var(--gold);}
  .line-row .swatch{width:14px; height:14px; border-radius:3px; flex-shrink:0;}
  .line-row .lname{flex:1;}
  .line-row .lcount{color:var(--muted); font-variant-numeric:tabular-nums;}
  #foundHead{font-size:13px; color:var(--muted); margin-top:16px; padding-top:10px; border-top:1px solid var(--line);}
  #foundList{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{
    font-size:12.5px; background:#f5f4f1; border:1px solid var(--line); border-radius:12px;
    padding:3px 10px; color:#444;
  }
  #toast{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    padding:8px 18px; border-radius:20px; font-size:14px; font-weight:600; color:#fff;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:10;
  }
  #toast.show{opacity:1;}
  #toast.ok{background:#2e8b57;}
  #toast.bad{background:#c0392b;}
  #toast.dup{background:#888;}
  footer{
    padding:6px 22px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line);
    flex-shrink:0; background:var(--panel-bg);
  }
  #summaryBox{display:none; margin-top:14px; padding:12px; border:1px solid var(--gold); border-radius:8px; background:#fffaf0; font-size:13.5px; line-height:1.7;}

/* ---------------- Responsive (tablet / phone) ---------------- */
@media (max-width: 860px){
  html,body{height:auto; min-height:100%;}
  body{overflow:visible; height:auto;}
  header{padding:10px 14px 8px 14px; flex-wrap:wrap; gap:4px 12px;}
  header h1{font-size:17px;}
  header .sub{font-size:11px; line-height:1.5;}
  header .stats{font-size:13px;}
  header .stats b{font-size:17px;}
  main{flex-direction:column; overflow:visible;}
  #mapwrap{height:52vh; flex:none; width:100%;}
  #sidebar{
    width:100%; border-left:none; border-top:1px solid var(--line);
    max-height:none; overflow-y:visible; padding:14px 14px 20px 14px;
  }
  #inputRow{gap:8px;}
  #stationInput{font-size:16px; padding:13px 12px;} /* 16px avoids iOS auto-zoom */
  #confirmBtn{font-size:15px; padding:0 16px;}
  .action-row button{padding:13px 0; font-size:14.5px;}
  .zoom-ctrl{right:10px; bottom:10px;}
  .zoom-ctrl button{width:40px; height:40px; font-size:19px;}
  .line-row{font-size:13.5px; padding:8px 2px;}
  footer{font-size:10px; padding:6px 14px;}
}
</style>
</head>

<header>
  <div>

    <div class="sub">涵蓋JR東日本（山手線、中央線、總武線、京濱東北線、東海道線、常磐線、京葉線、埼京線）、東京Metro九條路線、都營地下鐵四條路線</div>
  </div>

<main>

  </div>
  <div id="sidebar">
    <div id="inputRow">
      <input id="stationInput" type="text" placeholder="請輸入…" autocomplete="off">
      <button id="confirmBtn">確定</button>
    </div>
    <div class="hint">
      輸入中文、英文或日文漢字（例如：東京 / Tokyo / 東京）皆可。<br>
      想不出來了就按「交卷」看成績單。
    </div>
    <div class="action-row">
      <button id="revealBtn">公布解答</button>
      <button id="submitBtn">交卷</button>
    </div>
    <div id="lineListHead">
      <span>路線顯示</span>
      <span class="line-bulk-btns">
        <button id="showAllLines" type="button">全選</button>
        <button id="hideAllLines" type="button">全不選</button>
      </span>
    </div>
    <div id="lineList"></div>
    <div id="summaryBox"></div>
    <div id="foundHead">已找到的站</div>
    <div id="foundList"></div>
  </div>
</main>
<footer>純屬好玩，玩法參考「捷運車站你記得幾個？」。資料範圍為 JR 東日本主要路線＋東京Metro全九線＋都營地下鐵全四線之主要車站（不含全部支線及所有各站停靠站，車站位置為示意圖非精確地理位置）。</footer>

<script>
(function(){
  const svg = document.getElementById('svg');
  const viewport = document.getElementById('viewport');
  const linesLayer = document.getElementById('lines-layer');
  const stationsLayer = document.getElementById('stations-layer');
  svg.setAttribute('viewBox', `0 0 ${DATA.width} ${DATA.height}`);

  // ---- build line paths ----
  DATA.lines.forEach(line => {
    const pts = line.path.map(id => DATA.stations[id]);
    let d = 'M ' + pts.map(p => `${p.x},${p.y}`).join(' L ');
    if(line.loop) d += ' Z';
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('class','line-path');
    path.setAttribute('stroke', line.color);
    path.setAttribute('id', 'line-' + line.code);
    linesLayer.appendChild(path);
  });

  // ---- station -> line membership ----
  const stationLines = {};
  DATA.lines.forEach(line=>{
    line.path.forEach(id=>{
      (stationLines[id] = stationLines[id]||[]).push(line.code);
    });
  });

  // ---- build station dots ----
  const dotEls = {}, labelEls = {};
  Object.entries(DATA.stations).forEach(([id, st])=>{
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', st.x); c.setAttribute('cy', st.y);
    c.setAttribute('r', 9);
    c.setAttribute('class','station-dot unfound');
    c.dataset.id = id;
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', st.x + 13); t.setAttribute('y', st.y + 5);
    t.setAttribute('class','station-label');
    t.textContent = st.zh;
    g.appendChild(c); g.appendChild(t);
    stationsLayer.appendChild(g);
    dotEls[id] = c; labelEls[id] = t;
    c.addEventListener('click', ()=>{ if(!found.has(id) && !gameOver){ input.value = st.zh; input.focus(); } });
  });

  // ---- normalization / matching ----
  const VARIANT_MAP = {
    '涩':'澀','泽':'澤','浜':'濱','桥':'橋','龙':'龍','岛':'島','荣':'榮',
    '国':'國','东':'東','当':'當','广':'廣','门':'門','丰':'豐','龟':'龜',
    '苏':'蘇','树':'樹','沢':'澤','渋':'澀','変':'變','検':'檢','駅':'',
  };
  function normalize(s){
    if(!s) return '';
    s = s.trim().toLowerCase();
    s = s.replace(/\s+/g,'');
    s = s.replace(/station$|駅$|站$/g,'');
    s = s.replace(/[-‧・']/g,'');
    s = s.split('').map(ch=>VARIANT_MAP[ch]!==undefined?VARIANT_MAP[ch]:ch).join('');
    return s;
  }
  const answerIndex = {}; // normalized string -> station id
  Object.entries(DATA.stations).forEach(([id, st])=>{
    [st.zh, st.en, st.ja].forEach(v=>{
      const n = normalize(v);
      if(n) answerIndex[n] = id;
    });
  });

  // ---- state ----
  const found = new Set();
  let gameOver = false;
  const totalUnique = Object.keys(DATA.stations).length;
  document.getElementById('totalCount').textContent = totalUnique;

  function lineFoundCount(line){
    const ids = new Set(line.path);
    let n = 0; ids.forEach(id=>{ if(found.has(id)) n++; });
    return n;
  }

  // ---- line show/hide ----
  const visibleLines = new Set(DATA.lines.map(l=>l.code));
  function applyLineVisibility(){
    DATA.lines.forEach(line=>{
      const path = document.getElementById('line-'+line.code);
      if(path) path.style.display = visibleLines.has(line.code) ? '' : 'none';
    });
    Object.keys(DATA.stations).forEach(id=>{
      const anyVisible = (stationLines[id]||[]).some(code=>visibleLines.has(code));
      const g = dotEls[id].parentNode;
      g.style.display = anyVisible ? '' : 'none';
    });
  }
  function setLineVisible(code, visible){
    if(visible) visibleLines.add(code); else visibleLines.delete(code);
    applyLineVisibility();
    renderLineList();
  }

  function renderLineList(){
    const box = document.getElementById('lineList');
    box.innerHTML = '';
    DATA.lines.forEach(line=>{
      const total = new Set(line.path).size;
      const n = lineFoundCount(line);
      const pct = total? (n/total*100).toFixed(0):0;
      const visible = visibleLines.has(line.code);
      const row = document.createElement('div');
      row.className = 'line-row' + (visible ? '' : ' line-off');
      row.innerHTML = `<input type="checkbox" class="lvis" ${visible?'checked':''} title="是否顯示在地圖上">
        <span class="swatch" style="background:${line.color}"></span>
        <span class="lname">${line.code} ${line.name}</span>
        <span class="lcount">${n}/${total} · ${pct}%</span>`;
      row.querySelector('.lvis').addEventListener('change', e=>{
        setLineVisible(line.code, e.target.checked);
      });
      box.appendChild(row);
    });
  }

  document.getElementById('showAllLines').addEventListener('click', ()=>{
    DATA.lines.forEach(l=>visibleLines.add(l.code));
    applyLineVisibility(); renderLineList();
  });
  document.getElementById('hideAllLines').addEventListener('click', ()=>{
    visibleLines.clear();
    applyLineVisibility(); renderLineList();
  });

  function updateHeader(){
    document.getElementById('foundCount').textContent = found.size;
    document.getElementById('pct').textContent = (found.size/totalUnique*100).toFixed(1)+'%';
  }

  function renderFoundList(){
    const box = document.getElementById('foundList');
    box.innerHTML = '';
    [...found].forEach(id=>{
      const st = DATA.stations[id];
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = `${st.zh} ${st.ja!==st.zh? '('+st.ja+')':''}`;
      box.appendChild(chip);
    });
  }

  let toastTimer=null;
  function toast(msg, cls){
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'show ' + cls;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.className = cls; }, 900);
  }

  function markFound(id){
    found.add(id);
    const c = dotEls[id], t = labelEls[id];
    c.classList.remove('unfound','revealed-miss');
    c.classList.add('found');
    c.setAttribute('r', 11);
    c.setAttribute('fill', '#b8860b');
    t.classList.remove('miss');
    t.classList.add('show');
    renderLineList(); updateHeader(); renderFoundList();
  }

  function tryAnswer(raw){
    if(gameOver) return;
    const n = normalize(raw);
    if(!n) return;
    const id = answerIndex[n];
    if(!id){ toast('查無此站','bad'); return; }
    if(found.has(id)){ toast(DATA.stations[id].zh+' 已經找過了','dup'); return; }
    markFound(id);
    toast('答對！'+DATA.stations[id].zh, 'ok');
  }

  const input = document.getElementById('stationInput');
  document.getElementById('confirmBtn').addEventListener('click', ()=>{
    tryAnswer(input.value); input.value=''; input.focus();
  });
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ tryAnswer(input.value); input.value=''; }
  });

  document.getElementById('revealBtn').addEventListener('click', ()=>{
    Object.keys(DATA.stations).forEach(id=>{
      if(!found.has(id)){
        labelEls[id].classList.add('show');
      }
    });
  });

  document.getElementById('submitBtn').addEventListener('click', ()=>{
    gameOver = true;
    Object.keys(DATA.stations).forEach(id=>{
      if(!found.has(id)){
        dotEls[id].classList.add('revealed-miss');
        labelEls[id].classList.add('show','miss');
      }
    });
    input.disabled = true;
    document.getElementById('confirmBtn').disabled = true;
    const box = document.getElementById('summaryBox');
    box.style.display = 'block';
    let rows = DATA.lines.map(line=>{
      const total = new Set(line.path).size;
      const n = lineFoundCount(line);
      return `${line.code} ${line.name}：${n}/${total}`;
    }).join('<br>');
    box.innerHTML = `<b>已交卷！最終成績</b><br>總計：${found.size} / ${totalUnique}（${(found.size/totalUnique*100).toFixed(1)}%）<br><br>${rows}`;
    toast('已交卷', 'dup');
  });

  // ---- zoom / pan ----
  let scale=1, panX=0, panY=0;
  function applyTransform(){
    viewport.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
  }
  function zoomAt(factor){
    const newScale = Math.min(6, Math.max(0.5, scale*factor));
    const cx = DATA.width/2, cy = DATA.height/2;
    panX = cx - (cx-panX)*(newScale/scale);
    panY = cy - (cy-panY)*(newScale/scale);
    scale = newScale;
    applyTransform();
  }
  document.getElementById('zoomIn').addEventListener('click', ()=>zoomAt(1.25));
  document.getElementById('zoomOut').addEventListener('click', ()=>zoomAt(0.8));
  document.getElementById('zoomReset').addEventListener('click', ()=>{ scale=1; panX=0; panY=0; applyTransform(); });

  const mapwrap = document.getElementById('mapwrap');
  let dragging=false, lastX=0, lastY=0;
  mapwrap.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; mapwrap.classList.add('dragging'); });
  window.addEventListener('mouseup', ()=>{ dragging=false; mapwrap.classList.remove('dragging'); });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const rect = svg.getBoundingClientRect();
    const ux = DATA.width/rect.width, uy = DATA.height/rect.height;
    panX += (e.clientX-lastX)*ux; panY += (e.clientY-lastY)*uy;
    lastX=e.clientX; lastY=e.clientY;
    applyTransform();
  });
  mapwrap.addEventListener('wheel', e=>{
    e.preventDefault();
    zoomAt(e.deltaY<0?1.1:0.9);
  }, {passive:false});

  // touch: one-finger pan, two-finger pinch zoom
  function touchDist(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
  let lastPinchDist = null;
  mapwrap.addEventListener('touchstart', e=>{
    if(e.touches.length===1){
      dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    } else if(e.touches.length===2){
      dragging=false; lastPinchDist = touchDist(e.touches[0], e.touches[1]);
    }
  }, {passive:true});
  mapwrap.addEventListener('touchmove', e=>{
    if(e.touches.length===1 && dragging){
      const rect = svg.getBoundingClientRect();
      const ux = DATA.width/rect.width, uy = DATA.height/rect.height;
      const t = e.touches[0];
      panX += (t.clientX-lastX)*ux; panY += (t.clientY-lastY)*uy;
      lastX = t.clientX; lastY = t.clientY;
      applyTransform();
      e.preventDefault();
    } else if(e.touches.length===2){
      const d = touchDist(e.touches[0], e.touches[1]);
      if(lastPinchDist){ zoomAt(d/lastPinchDist); }
      lastPinchDist = d;
      e.preventDefault();
    }
  }, {passive:false});
  mapwrap.addEventListener('touchend', ()=>{ dragging=false; lastPinchDist=null; });

  applyLineVisibility();
  renderLineList(); updateHeader(); renderFoundList();
  input.focus();
})();
</script>
</body>
</html>
